---
# oic-sync release to install (a GitHub release of open-img-cloud/oic-sync with packages).
oic_sync_version: "0.3.0"
oic_sync_release_url: https://github.com/open-img-cloud/oic-sync/releases/download/v{{ oic_sync_version }}
# Where the package is downloaded on the host.
oic_sync_download_dir: /var/cache/oic-sync-packages

# auto: verify the cosign signature of the package when cosign is installed on the host;
# required: fail without cosign; never: only the sha256 of the release SHA256SUMS is checked.
oic_sync_verify_signature: auto
oic_sync_cosign: cosign
oic_sync_certificate_identity_regexp: ^https://github\.com/open-img-cloud/oic-sync/\.github/workflows/packages\.yml@refs/tags/v
oic_sync_certificate_oidc_issuer: https://token.actions.githubusercontent.com

# Write the options file and enable or disable the timers. false: install the package only
# (used by the oic_mirror role, so it leaves an existing Proxmox VE or OpenStack setup alone).
oic_sync_configure: true

# Proxmox VE (runs as root on the node): images to keep as VM templates, and other options,
# e.g. "--vmid-base 9000 --keep 2 --delete". The timer is enabled when images are listed.
oic_sync_proxmox_images: []
oic_sync_proxmox_extra_args: ""
oic_sync_proxmox_timer: "{{ oic_sync_proxmox_images | length > 0 }}"

# OpenStack: clouds.yaml entry (in /etc/openstack/clouds.yaml, readable by the service), images
# and other options, e.g. "--keep 2". The timer is enabled when a cloud and images are set.
oic_sync_openstack_cloud: ""
oic_sync_openstack_images: []
oic_sync_openstack_extra_args: ""
oic_sync_openstack_timer: "{{ oic_sync_openstack_cloud | length > 0 and oic_sync_openstack_images | length > 0 }}"
